# Nginx backend for new8
# Public ports must be handled by HAProxy. Do not listen on 80/443 here.

server {
    listen 1010 proxy_protocol so_keepalive=on reuseport;
    server_name xxx;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    client_body_buffer_size 200K;
    client_header_buffer_size 2k;
    client_max_body_size 10M;
    large_client_header_buffers 3 1k;
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-XSS-Protection "1; mode=block";

    location /vless {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    }

    location /vmess {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10002;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    }

    location /trojan-ws {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10003;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    }

    # Compatibility for old v7 clients that used /trojan
    location /trojan {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10003;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    }

    location /ss-ws {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10004;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    }

    # SSH WebSocket fallback
    location / {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    }
}

