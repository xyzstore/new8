# Public config files. This still listens publicly on 81, but avoids conflict with HAProxy.
server {
    listen 81 ssl http2 reuseport;
    listen [::]:81 ssl http2 reuseport;
    server_name xxx;

    ssl_certificate /etc/xray/xray.crt;
    ssl_certificate_key /etc/xray/xray.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:!MD5;

    root /var/www/html;
}

# gRPC backend. HAProxy routes ALPN h2 traffic here.
server {
    listen 1013 http2 proxy_protocol so_keepalive=on reuseport;
    server_name xxx;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    client_body_buffer_size 200K;
    client_header_buffer_size 2k;
    client_max_body_size 10M;
    large_client_header_buffers 3 1k;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    grpc_read_timeout 300s;
    grpc_send_timeout 300s;

    location /vless-grpc {
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $proxy_protocol_addr;
        grpc_set_header X-Forwarded-For $proxy_protocol_addr;
        grpc_pass grpc://127.0.0.1:10005;
    }

    location /vmess-grpc {
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $proxy_protocol_addr;
        grpc_set_header X-Forwarded-For $proxy_protocol_addr;
        grpc_pass grpc://127.0.0.1:10006;
    }

    location /trojan-grpc {
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $proxy_protocol_addr;
        grpc_set_header X-Forwarded-For $proxy_protocol_addr;
        grpc_pass grpc://127.0.0.1:10007;
    }

    location /ss-grpc {
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $proxy_protocol_addr;
        grpc_set_header X-Forwarded-For $proxy_protocol_addr;
        grpc_pass grpc://127.0.0.1:10008;
    }
}
